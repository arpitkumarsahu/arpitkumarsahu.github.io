  <head>
    <meta charset="utf-8" />
    <!-- Tab icon: round crop of Arpit's photo. Bump ?v= when the icons change (browsers cache them hard). -->

    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png?v=2">

    <meta name="viewport" content="width=device-width, initial-scale=1" />

      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png?v=2">

    <!-- <meta property="og:image" content="https://developerfolio.js.org/static/media/developerActivity.59389695.svg" /> -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      (function () {
        var isDark = true;
        try {
          var stored = localStorage.getItem("isDark");
          if (stored !== null) isDark = JSON.parse(stored);
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
      })();
    </script>
